<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Finance">
  <link rel="apple-touch-icon" href="icons/icon.png">
  <link rel="icon" type="image/png" href="icons/icon.png"/>
  <title>Finance</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Mitigation for Flutter web on-screen keyboard inset bug on Android Chrome
    // (https://github.com/flutter/flutter/issues/175074).
    // When the virtual keyboard is dismissed, force the browser scroll back to
    // top and blur any focused input so the engine does not compute negative
    // viewInsets, which otherwise throws:
    //   "ViewInsets cannot be negative ... keyboard is being dismissed."
    (function () {
      if (!window.visualViewport) return;
      var lastHeight = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', function () {
        var currentHeight = window.visualViewport.height;
        if (currentHeight > lastHeight + 100) {
          window.scrollTo(0, 0);
          var active = document.activeElement;
          if (active &&
              (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
            active.blur();
          }
        }
        lastHeight = currentHeight;
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
